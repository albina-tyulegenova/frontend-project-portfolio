<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photographer</title>
    <link rel="icon" href="/portfolio/assets/svg/Logo.svg">
    <link rel="stylesheet" href="style.css">       
</head>
<body>
    <header class="header">
        <a href="/" class="header-logo">
            <img src="/portfolio/assets/svg/Logo.svg" alt="Logo" class="header-logo-img" width="20" height="20" loading="lazy">
        </a>
        <nav class="header-menu">
            <ul class="header-menu-list">
                <li class="header-menu-item">
                    <a href="#about_me" class="header-menu-link">About me</a>
                </li>
                <li class="header-menu-item">
                    <a href="#portfolio" class="header-menu-link">Portfolio</a>
                </li>
                <li class="header-menu-item">
                    <a href="#price" class="header-menu-link">Price</a>
                </li>
                <li class="header-menu-item">
                    <a href="#faq" class="header-menu-link">FAQ</a>
                </li>
                <li class="header-menu-item">
                    <a href="#contacts" class="header-menu-link">Contacts</a>
                </li>
            </ul>
        </nav>
        <div class="burger-menu">
            <span></span>
        </div>
    </header>
    <main class="content">
        <section class="hero">
            <div class="hero-sidebar">
                <div class="hero-sidebar-text">Best Photographer by MAX</div>
                <div class="hero-sidebar-year"><span>2025</span></div>
            </div>
            <div class="hero-body">
                <div class="hero-first-column">
                    <div class="hero-info">
                        <div class="hero-stats">
                            <div class="hero-stats-info">
                                <div class="hero-stats-number">+ 487</div>
                                <div class="hero-stats-text">Photo sessions</div>
                            </div>
                            <div class="hero-stats-info">
                                <div class="hero-stats-number">+ 356</div>
                                <div class="hero-stats-text">Satisfied clients</div>
                            </div>
                        </div>
                        <h1 class="hero-title">Professional<br>photographer</h1>
                        <h3 class="hero-text">Capture the Moment. Tell Your Story.</h3>
                    </div>
                    <a class="hero-scroll" href="#price">
                        <div class="hero-scroll-text">Scroll down</div>
                        <svg class="hero-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 5V19" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M19 12L12 19L5 12" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>
                </div>
                <div class="hero-second-column">
                    <img class="hero-little-image" src="/portfolio/assets/img/img-hero-1.webp" alt="Image 1">
                </div>
                <div class="hero-third-column">
                    <img src="/portfolio/assets/img/img-hero-2.webp" alt="Image 2" class="hero-big-image">
                    <p class="introduction-text">Hi! I’m Vera, a photographer.<br>For me, photography is more<br>than just an image.</p>
                </div>      
            </div>
        </section>
    </main>
    



    <script>
        document.querySelector('.burger-menu').addEventListener('click', function() {
            this.classList.toggle('active');
            document.querySelector('.header-menu').classList.toggle('open');
        })
    </script>
</body>
</html>
